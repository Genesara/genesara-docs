name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync schema (best-effort)
        run: pnpm sync:schema
        continue-on-error: true

      - name: Build tools.json
        run: pnpm build:tools-json

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm exec astro build
